<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer une publication - Miracle GB</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .publication-box {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: none;
            font-size: 16px;
        }

        input {
            margin-top: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Miracle GB</h1>
</header>

<div class="publication-box">

    <h2>📝 Créer une publication</h2>

    <textarea
        id="texte"
        placeholder="Quoi de neuf ?"
    ></textarea>

    <br>

    <label>🖼️ Ajouter une image :</label>
    <input type="file" accept="image/*">

    <br><br>

    <label>🎬 Ajouter une vidéo :</label>
    <input type="file" accept="video/*">

    <button onclick="publier()">
        Publier
    </button>

    <a href="../index.html">
        🏠 Retour à l'accueil
    </a>

</div>

<script>
    function publier() {

        const texte = document.getElementById("texte").value;

        if (texte.trim() === "") {
            alert("Écris quelque chose avant de publier.");
            return;
        }

        alert("Publication créée sur Miracle GB !");
    }
</script>

</body>
</html>
