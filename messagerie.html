<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messagerie - Miracle GB</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .messagerie {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
        }

        .utilisateur {
            padding: 18px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .utilisateur:hover {
            background: #f5f5f5;
        }

        .conversation {
            padding: 20px;
        }

        #messages {
            min-height: 250px;
            max-height: 350px;
            overflow-y: auto;
            padding: 10px;
            background: #f7f7f7;
            border-radius: 10px;
        }

        .message {
            background: #e8e8e8;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
        }

        .message.moi {
            text-align: right;
            background: #111;
            color: white;
        }

        .zone-envoi {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 13px 18px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin: 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>💬 Miracle GB</h1>
</header>

<div class="messagerie">

    <div class="utilisateur" onclick="ouvrirConversation('Amis')">
        👤 Amis
    </div>

    <div class="utilisateur" onclick="ouvrirConversation('Miracle')">
        👤 Miracle
    </div>

    <div class="utilisateur" onclick="ouvrirConversation('Utilisateur')">
        👤 Utilisateur
    </div>

    <div class="conversation">

        <h2 id="nomContact">Sélectionne une conversation</h2>

        <div id="messages"></div>

        <div class="zone-envoi">

            <input
                type="text"
                id="message"
                placeholder="Écrire un message..."
                onkeydown="toucheEntree(event)"
            >

            <button onclick="envoyerMessage()">
                Envoyer
            </button>

        </div>

    </div>

</div>

<a href="../index.html">
    🏠 Retour à l'accueil
</a>

<script>

let contactActuel = "";

function ouvrirConversation(nom) {

    contactActuel = nom;

    document.getElementById("nomContact").textContent =
        "Conversation avec " + nom;

    document.getElementById("messages").innerHTML = "";

    ajouterMessage("Bonjour ! Bienvenue sur Miracle GB.", false);
}

function envoyerMessage() {

    const champ = document.getElementById("message");
    const texte = champ.value.trim();

    if (texte === "") {
        return;
    }

    ajouterMessage(texte, true);

    champ.value = "";
}

function ajouterMessage(texte, moi) {

    const message = document.createElement("div");

    message.className = moi
        ? "message moi"
        : "message";

    message.textContent = texte;

    document.getElementById("messages")
        .appendChild(message);
}

function toucheEntree(event) {

    if (event.key === "Enter") {
        envoyerMessage();
    }
}

</script>

</body>
</html>
